name: codux_remote_iroh
description: Iroh remote transport bridge for Codux Flutter.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: ">=3.35.0"

dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.codux.remote_iroh
        pluginClass: CoduxRemoteIrohPlugin
      ios:
        pluginClass: CoduxRemoteIrohPlugin
