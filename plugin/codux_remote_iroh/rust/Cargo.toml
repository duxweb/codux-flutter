[package]
name = "codux_remote_iroh_bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "codux_remote_iroh_bridge"
crate-type = ["cdylib", "staticlib"]

[dependencies]
iroh = "0.35.0"
once_cell = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util"] }
