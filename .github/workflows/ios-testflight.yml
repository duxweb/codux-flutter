name: iOS TestFlight
run-name: >-
  ${{
    github.event_name == 'push'
    && format('iOS TestFlight {0}', github.ref_name)
    || format('iOS TestFlight v{0}', github.event.inputs.version)
  }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "App version, for example 0.1.6"
        required: true
      source_ref:
        description: "duxweb/codux ref to build, for example main, v1.8.1, or a commit SHA"
        required: false
        default: main
      build_number:
        description: "Build number override. Defaults to the GitHub run number."
        required: false
      upload_to_testflight:
        description: "Upload the IPA to App Store Connect after building"
        required: false
        default: true
        type: boolean
      log_level:
        description: "CODUX_LOG_LEVEL"
        required: false
        default: warn
        type: choice
        options:
          - debug
          - info
          - warn
          - error
          - off

jobs:
  build-and-upload:
    runs-on: macos-26
    permissions:
      contents: read

    concurrency:
      group: ios-testflight-${{ github.ref_name || github.run_id }}
      cancel-in-progress: false

    env:
      IOS_BUNDLE_ID: com.codux.mobile
      IOS_TEAM_ID: USA572LS4F
      IOS_PROVISIONING_PROFILE_NAME: Codux Mobile App Store
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "14.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: duxweb/codux
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.source_ref || 'main' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Set up Zig
        shell: bash
        run: |
          brew install zig@0.15
          zig_path="$(brew --prefix zig@0.15)/bin/zig"
          echo "ZIG=$zig_path" >> "$GITHUB_ENV"
          "$zig_path" version

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [[ -z "${version}" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "${version}" ]]; then
            echo "iOS version is missing" >&2
            exit 1
          fi
          build_name="${version%%-*}"
          if [[ -z "${build_name}" ]]; then
            echo "iOS build name is missing" >&2
            exit 1
          fi

          build_number="${{ github.event.inputs.build_number }}"
          if [[ -z "${build_number}" ]]; then
            build_number="${GITHUB_RUN_NUMBER}"
          fi

          upload_to_testflight="${{ github.event.inputs.upload_to_testflight }}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            upload_to_testflight="true"
          elif [[ -z "${upload_to_testflight}" ]]; then
            upload_to_testflight="true"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_name=${build_name}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "upload_to_testflight=${upload_to_testflight}" >> "$GITHUB_OUTPUT"

      - name: Validate iOS secrets
        shell: bash
        env:
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          missing=()
          [[ -n "${IOS_DISTRIBUTION_CERT_BASE64:-}" ]] || missing+=("IOS_DISTRIBUTION_CERT_BASE64")
          [[ -n "${IOS_DISTRIBUTION_CERT_PASSWORD:-}" ]] || missing+=("IOS_DISTRIBUTION_CERT_PASSWORD")
          [[ -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]] || missing+=("IOS_PROVISIONING_PROFILE_BASE64")

          if [[ "${{ steps.meta.outputs.upload_to_testflight }}" == "true" ]]; then
            [[ -n "${APP_STORE_CONNECT_API_KEY_ID:-}" ]] || missing+=("APP_STORE_CONNECT_API_KEY_ID")
            [[ -n "${APP_STORE_CONNECT_API_ISSUER_ID:-}" ]] || missing+=("APP_STORE_CONNECT_API_ISSUER_ID")
            [[ -n "${APP_STORE_CONNECT_API_KEY_P8_BASE64:-}" ]] || missing+=("APP_STORE_CONNECT_API_KEY_P8_BASE64")
          fi

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub secrets:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Install Apple signing assets
        shell: bash
        env:
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          cert_path="$RUNNER_TEMP/apple_distribution.p12"
          profile_path="$RUNNER_TEMP/app_store.mobileprovision"
          keychain_path="$RUNNER_TEMP/codux-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$IOS_DISTRIBUTION_CERT_BASE64" | base64 -D > "$cert_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Build Rust FFI for host tests
        shell: bash
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache-host
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache-host
        run: |
          rm -rf "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR"
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR"
          cargo build -p codux-protocol-ffi --release

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Build Rust FFI for iOS
        shell: bash
        env:
          PLATFORM_NAME: iphoneos
          ARCHS: arm64
          CONFIGURATION: Release
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache-ios
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache-ios
        run: |
          rm -rf "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR"
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR"
          bash apps/mobile/plugin/codux_protocol_ffi/scripts/build-apple.sh

      - name: Create export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Build IPA
        working-directory: apps/mobile
        shell: bash
        run: |
          flutter build ipa --release \
            --build-name "${{ steps.meta.outputs.build_name }}" \
            --build-number "${{ steps.meta.outputs.build_number }}" \
            --dart-define "CODUX_LOG_LEVEL=${{ github.event.inputs.log_level || 'warn' }}" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify IPA metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ipa-check"
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q apps/mobile/build/ios/ipa/*.ipa -d "$RUNNER_TEMP/ipa-check"

          app_path="$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$app_path"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist"
          find "$app_path/Frameworks" -maxdepth 1 -type d -name '*.framework' -print | sort
          ghostty_plist="$app_path/Frameworks/libghostty.framework/Info.plist"
          if [ -f "$ghostty_plist" ]; then
            /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$ghostty_plist"
          fi
          bash apps/mobile/scripts/release/verify-ios-ffi-symbols.sh apps/mobile/build/ios/ipa/*.ipa
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: codux-ios-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.build_number }}
          path: apps/mobile/build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: steps.meta.outputs.upload_to_testflight == 'true'
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file apps/mobile/build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
