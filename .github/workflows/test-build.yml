name: Test Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version, for example 1.0.0"
        required: true
      package_version:
        description: "Artifact label, for example 1.0.0-test-20260428"
        required: false
      build_number:
        description: "Build number override"
        required: false
      source_ref:
        description: "duxweb/codux ref to build, for example main, v1.8.1, or a commit SHA"
        required: false
        default: main
      configuration:
        description: "Flutter build mode"
        required: false
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      log_level:
        description: "CODUX_LOG_LEVEL"
        required: false
        default: debug
        type: choice
        options:
          - debug
          - info
          - warn
          - error
          - off

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    concurrency:
      group: mobile-test-build-${{ github.ref_name }}-${{ github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: duxweb/codux
          ref: ${{ github.event.inputs.source_ref || 'main' }}

      - name: Set build working directory
        shell: bash
        run: echo "MOBILE_DIR=apps/mobile" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          package_version="${{ github.event.inputs.package_version }}"
          build_number="${{ github.event.inputs.build_number }}"
          configuration="${{ github.event.inputs.configuration }}"

          if [[ -z "${version}" ]]; then
            echo "Build version is missing" >&2
            exit 1
          fi

          if [[ -z "${build_number}" ]]; then
            build_number="${GITHUB_RUN_NUMBER}"
          fi

          if [[ -z "${package_version}" ]]; then
            date_suffix="$(date +%Y%m%d)"
            if [[ "${configuration}" == "Debug" ]]; then
              package_version="${version}-debug-${date_suffix}"
            else
              package_version="${version}-test-${date_suffix}"
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "configuration=${configuration}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_NDK_VERSION: "27.0.12077973"
        run: |
          yes | sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust FFI for Android
        shell: bash
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache-android
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache-android
        run: |
          rm -rf "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR"
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR"
          bash "$MOBILE_DIR/plugin/codux_protocol_ffi/scripts/build-android.sh"

      - name: Build APK
        working-directory: apps/mobile
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ steps.meta.outputs.configuration }}" == "Debug" ]]; then
            flutter build apk --debug \
              --build-name "${{ steps.meta.outputs.version }}" \
              --build-number "${{ steps.meta.outputs.build_number }}" \
              --dart-define "CODUX_LOG_LEVEL=${{ github.event.inputs.log_level }}"
            cp build/app/outputs/flutter-apk/app-debug.apk "dist/Codux-Mobile-${{ steps.meta.outputs.package_version }}-android-debug.apk"
          else
            flutter build apk --release --split-per-abi \
              --build-name "${{ steps.meta.outputs.version }}" \
              --build-number "${{ steps.meta.outputs.build_number }}" \
              --dart-define "CODUX_LOG_LEVEL=${{ github.event.inputs.log_level }}"
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Codux-Mobile-${{ steps.meta.outputs.package_version }}-android-release.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codux-mobile-${{ steps.meta.outputs.package_version }}-manual
          path: |
            apps/mobile/dist/*.apk
            apps/mobile/dist/SHA256SUMS.txt
          if-no-files-found: error
